name: build all offline raspOVOS images

on:
  workflow_dispatch:
    inputs:
      base_image_url:
        description: "Override the raspOVOS base image URL (reproduce an old build)"
        required: false
        default: ""
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/build_offline_lang_images.yml'
      - 'lang_builds/offline/build_raspOVOS_*.sh'
      - 'overlays/**'

jobs:
  get-date-release-name:
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.current-date.outputs.release_name }}
    steps:
      - name: Get Current Date and Release Name
        id: current-date
        run: |
          current_date=$(date +'%Y-%m-%d')
          release_name="raspOVOS-bookworm-arm64-offline-${current_date}"
          echo "release_name=$release_name" >> $GITHUB_OUTPUT

  # Resolve the newest base image release (override via input)
  resolve-base:
    runs-on: ubuntu-24.04
    outputs:
      base_image_url: ${{ steps.resolve.outputs.base_image_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve base image URL
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.base_image_url }}" ]; then
            url="${{ github.event.inputs.base_image_url }}"
          else
            url="$(./scripts/ci/resolve_base_image.sh raspOVOS-DEV-bookworm-arm64-offline)"
          fi
          echo "base_image_url=$url" >> $GITHUB_OUTPUT
          echo "Using base image: $url"

  build-all-images:
    runs-on: ubuntu-24.04
    needs: [ get-date-release-name, resolve-base ]
    strategy:
      fail-fast: false
      matrix:
        lang: [ca, gl, en, es, eu, pt, nl, de, it, fr, da]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build image for ${{ matrix.lang }}
        id: build
        uses: TigreGotico/rpi-image-modifier@main
        env:
          OVOS_USER: 'ovos'
          PASSWORD: 'ovos'
          HOSTNAME: "raspOVOS"
          CONSTRAINTS: "https://github.com/OpenVoiceOS/OpenVoiceOS/raw/refs/heads/main/constraints-alpha.txt"
          BASE_IMAGE_URL: "${{ needs.resolve-base.outputs.base_image_url }}"
        with:
          base-image-url: ${{ needs.resolve-base.outputs.base_image_url }}
          image-path: raspOVOS-${{ matrix.lang }}-bookworm-arm64-offline.img
          compress-with-xz: true
          shrink: true
          cache: false
          mount-repository: true
          env-vars: USER,PASSWORD,HOSTNAME,CONSTRAINTS,BASE_IMAGE_URL,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_REPOSITORY
          script-path: lang_builds/offline/build_raspOVOS_${{ matrix.lang }}.sh

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support systemd-container

      - name: "Tier 1: static image assertions"
        run: sudo make test-static IMG=raspOVOS-${{ matrix.lang }}-bookworm-arm64-offline.img.xz

      - name: "Tier 2: chroot functional checks"
        run: sudo make test-chroot IMG=raspOVOS-${{ matrix.lang }}-bookworm-arm64-offline.img.xz VARIANT=offline

      - name: Upload built image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raspOVOS-${{ matrix.lang }}
          path: raspOVOS-${{ matrix.lang }}-bookworm-arm64-offline.img.xz

  create-release:
    runs-on: ubuntu-24.04
    needs: [get-date-release-name, build-all-images]
    outputs:
      release_id: ${{ steps.get-release-id.outputs.release_id }}
    steps:
      - name: Create or Get Release ID
        id: get-release-id
        run: |
          release_name="${{ needs.get-date-release-name.outputs.release_name }}"
          release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$release_name")
          release_id=$(echo "$release" | jq -r .id)
          if [[ "$release_id" == "null" ]]; then
            release=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$release_name\",\"name\":\"$release_name\",\"body\":\"RaspOVOS offline - multilingual image set (recommended rpi5 with 4GB RAM) \"}" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
            release_id=$(echo "$release" | jq -r .id)
          fi
          echo "release_id=$release_id" >> $GITHUB_OUTPUT

  upload-images:
    runs-on: ubuntu-24.04
    needs: [create-release, build-all-images]
    strategy:
      fail-fast: false
      matrix:
        lang: [ca, gl, en, es, eu, pt, nl, de, it, fr, da]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: raspOVOS-${{ matrix.lang }}

      - name: Upload ${{ matrix.lang }} image to release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: raspOVOS-${{ matrix.lang }}-bookworm-arm64-offline.img.xz
          release_id: ${{ needs.create-release.outputs.release_id }}
          draft: false
          overwrite: true
          prerelease: false
          verbose: true
