name: build base raspOVOS lite image

on:
  workflow_dispatch:
    inputs:
      base_image_url:
        description: "Override the Raspberry Pi OS base image URL (reproduce an old build)"
        required: false
        default: ""
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/build_raspOVOS_lite.yml'
      - 'build_raspOVOS_base_lite.sh'
      - 'overlays/base_ovos/**'
      - 'skills.list'

jobs:
  # Stage 1: Get Current Date and Release Name
  get-date-release-name:
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.current-date.outputs.release_name }}
      cache_key: ${{ steps.current-date.outputs.cache_key }}
    steps:
      - name: Get Current Date and Release Name
        id: current-date
        run: |
          current_date=$(date +'%Y-%m-%d')
          release_name="raspOVOS-DEV-bookworm-arm64-lite-${current_date}"
          cache_key="raspOVOS-lite-${{ github.run_id }}"
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "cache_key=$cache_key" >> $GITHUB_OUTPUT

      - name: Print outputs
        shell: bash
        run: |
          echo "cache_key: ${{ steps.current-date.outputs.cache_key }}"
          echo "release_name: ${{ steps.current-date.outputs.release_name }}"

  # Stage 2: Build Image
  modify-rpi-image:
    runs-on: ubuntu-24.04
    needs: get-date-release-name
    outputs:
      image-path: ${{ steps.create-image.outputs.image-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add OVOS to Raspberry Pi OS Bookworm
        uses: TigreGotico/rpi-image-modifier@main
        id: create-image
        env:
          OVOS_USER: 'ovos'
          PASSWORD: 'ovos'
          HOSTNAME: "raspOVOS"
          CONSTRAINTS: "https://github.com/OpenVoiceOS/OpenVoiceOS/raw/refs/heads/main/constraints-alpha.txt"
          BASE_IMAGE_URL: "${{ github.event.inputs.base_image_url || 'https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz' }}"
        with:
          base-image-url: ${{ github.event.inputs.base_image_url || 'https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz' }}
          image-path: raspOVOS-DEV-bookworm-arm64-lite.img
          compress-with-xz: true
          shrink: true
          cache: false
          mount-repository: true
          env-vars: USER,PASSWORD,HOSTNAME,CONSTRAINTS,BASE_IMAGE_URL,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_REPOSITORY
          script-path: build_raspOVOS_base_lite.sh
      - name: Print outputs
        shell: bash
        run: |
          echo "image-path: ${{ steps.create-image.outputs.image-path }}"
          echo "image-size: ${{ steps.create-image.outputs.image-size }}"
          echo "image-sha256sum: ${{ steps.create-image.outputs.image-sha256sum }}"

      - name: Save Image to Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ needs.get-date-release-name.outputs.cache_key }}

  # Stage 2.5: Smoke-test the image (Tier 1 static + Tier 2 chroot checks)
  smoke-test:
    runs-on: ubuntu-24.04
    needs: [ get-date-release-name, modify-rpi-image ]
    steps:
      - name: Restore Cache for Image
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ needs.get-date-release-name.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support systemd-container

      - name: "Tier 1: static image assertions"
        run: sudo make test-static IMG=${{ needs.modify-rpi-image.outputs.image-path }}

      - name: "Tier 2: chroot functional checks"
        run: sudo make test-chroot IMG=${{ needs.modify-rpi-image.outputs.image-path }} VARIANT=lite

  # Stage 3: Check if Release Exists and Create if Needed
  check-release-or-create:
    runs-on: ubuntu-24.04
    needs: [ get-date-release-name, modify-rpi-image, smoke-test ]
    outputs:
      release_id: ${{ steps.get-release-id.outputs.release_id }}
    steps:
      - name: Check if Release Exists
        id: get-release-id
        run: |
          release_name="${{ needs.get-date-release-name.outputs.release_name }}"
          release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$release_name")
          release_id=$(echo $release | jq -r .id)
          if [[ "$release_id" == "null" ]]; then
            release=$(curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$release_name\",\"name\":\"$release_name\",\"body\":\"FOR DEVELOPERS: Base OVOS setup. (defaults to online functionality, might work in rpi3) \"}" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
            release_id=$(echo $release | jq -r .id)
          fi
          echo "release_id=$release_id" >> $GITHUB_OUTPUT

      - name: Print outputs
        shell: bash
        run: |
          echo "release_id: ${{ steps.get-release-id.outputs.release_id }}"
          if [[ $release_id == "null" ]]; then
            echo "Failed to create release. Response: $release"
            exit 1
          fi

  # Stage 4: Upload to Release
  upload-image:
    runs-on: ubuntu-24.04
    if: ${{ needs.check-release-or-create.outputs.release_id }}
    needs: [ modify-rpi-image, check-release-or-create, get-date-release-name ]
    steps:
      - name: Restore Cache for Image
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ needs.get-date-release-name.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Debug Cache Content
        run: ls .

      - name: Upload to release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: ${{ needs.modify-rpi-image.outputs.image-path }}
          release_id: ${{ needs.check-release-or-create.outputs.release_id }}
          draft: false
          overwrite: true
          prerelease: false
          verbose: true
