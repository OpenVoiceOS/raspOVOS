{
  "lang": "pt-PT",
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "half",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
          "model": "Jarbas/ovos-model2vec-intents-serafim-335m-portuguese-pt-sentence-encoder",
          "conf_high": 0.7,
          "conf_medium": 0.5,
          "conf_low": 0.15,
          "ignore_intents": []
    },
    "persona": {
      "handle_fallback":  true,
      "default_persona": "Salamandra"
    },
    "pipeline": [
      "ocp_high",
      "stop_high",
      "converse",
      "padatious_high",
      "ovos-m2v-pipeline-high",
      "adapt_high",
      "stop_medium",
      "adapt_medium",
      "ovos-persona-pipeline-plugin-high",
      "common_qa",
      "fallback_medium",
      "ovos-persona-pipeline-plugin-low",
      "fallback_low"
    ]
  },
  "listener": {
    "stand_up_word": "acorda"
  },
  "hotwords": {
    "acorda": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "acorda",
        "acordar",
        "desperta",
        "despertar"
      ],
      "lang": "pt",
      "wakeup": true
    }
  },
  "stt": {
    "module": "ovos-stt-plugin-server",
    "fallback_module": "ovos-stt-plugin-citrinet",
    "ovos-stt-plugin-citrinet": {"lang": "pt"},
    "ovos-stt-plugin-server": {
        "urls": [
            "https://mynorthai.tigregotico.pt/stt",
            "https://stt.smartgic.io/mynorthai/stt",
            "https://stt.smartgic.io/fasterwhisper/stt"
        ]
    }
  },
  "tts": {
     "module": "ovos-tts-plugin-edge-tts",
     "ovos-tts-plugin-edge-tts": {
       "voice": "pt-PT-DuarteNeural"
     }
  },
  "location": {
    "city": {
      "code": "GMR",
      "name": "Guimarães",
      "state": {
        "code": "PT-03",
        "name": "Braga",
        "country": {
          "code": "PT",
          "name": "Portugal"
        }
      }
    },
    "coordinate": {
      "latitude": "41.4479",
      "longitude": "-8.2906"
    },
    "timezone": {
      "code": "Europe/Lisbon",
      "name": "Europa Lisboa"
    }
  }
}
