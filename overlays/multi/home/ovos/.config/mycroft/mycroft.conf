{
  "lang": "en-US",
  "secondary_langs": [
    "pt-PT",
    "fr-FR",
    "de-DE",
    "it-IT",
    "da-DK",
    "es-ES",
    "gl-ES",
    "ca-ES",
    "eu-ES"
  ],
  "intents": {
    "multilingual_matching": true,
    "ovos-m2v-pipeline": {
      "model": "Jarbas/ovos-model2vec-intents-LaBSE",
          "conf_high": 0.7,
          "conf_medium": 0.5,
          "conf_low": 0.15,
          "ignore_intents": []
    },
    "pipeline": [
      "ocp_high",
      "stop_high",
      "converse",
      "padatious_high",
      "ovos-m2v-pipeline-high",
      "adapt_high",
      "stop_medium",
      "adapt_medium",
      "ovos-persona-pipeline-plugin-high",
      "common_qa",
      "fallback_medium",
      "ovos-persona-pipeline-plugin-low",
      "fallback_low"
    ]
  },
  "stt": {
    "module": "ovos-stt-plugin-server",
    "fallback_module": "",
    "ovos-stt-plugin-server": {
      "lang": "auto",
      "urls": ["https://stt.smartgic.io/fasterwhisper/stt"]
    },
    "ovos-stt-plugin-fasterwhisper": {
      "lang": "auto",
      "model": "tiny"
    }
  },
  "tts": {
    "module": "ovos-tts-plugin-google-tx"
  }
}
