{
  "intents": {
    "ovos-m2v-pipeline": {
        "model": "Jarbas/ovos-model2vec-intents-potion-32M",
        "conf_high": 0.7,
        "conf_medium": 0.5,
        "conf_low": 0.15,
        "ignore_intents": []
    },
    "pipeline": [
      "ocp_high",
      "stop_high",
      "converse",
      "padatious_high",
      "ovos-m2v-pipeline-high",
      "adapt_high",
      "stop_medium",
      "adapt_medium",
      "ovos-persona-pipeline-plugin-high",
      "common_qa",
      "fallback_medium",
      "ovos-persona-pipeline-plugin-low",
      "fallback_low"
    ]
  },
  "tts": {
     "module": "ovos-tts-plugin-piper",
     "ovos-tts-plugin-piper": {
        "voice": "alan-low"
     }
  },
  "stt": {
    "module": "ovos-stt-plugin-server",
    "fallback_module": "",
    "ovos-stt-plugin-server": {
      "urls": [
        "https://stt.smartgic.io/fasterwhisper/stt",
        "https://fasterwhisper.ziggyai.online/stt"
      ]
    }
  }
}
