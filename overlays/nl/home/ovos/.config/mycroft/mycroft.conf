{
  "lang": "nl-NL",
  "system_unit": "metric",
  "temperature_unit": "celsius",
  "windspeed_unit": "km/h",
  "precipitation_unit": "mm",
  "time_format": "full",
  "spoken_time_format": "half",
  "date_format": "DMY",
  "intents": {
    "ovos-m2v-pipeline": {
        "model": "Jarbas/ovos-model2vec-intents-LaBSE",
        "conf_high": 0.7,
        "conf_medium": 0.5,
        "conf_low": 0.15,
        "ignore_intents": []
    },
    "pipeline": [
      "ocp_high",
      "stop_high",
      "converse",
      "padatious_high",
      "ovos-m2v-pipeline-high",
      "adapt_high",
      "stop_medium",
      "adapt_medium",
      "ovos-persona-pipeline-plugin-high",
      "common_qa",
      "fallback_medium",
      "ovos-persona-pipeline-plugin-low",
      "fallback_low"
    ]
  },
  "listener": {
    "stand_up_word": "wakker_worden"
  },
  "hotwords": {
    "wakker_worden": {
      "module": "ovos-ww-plugin-vosk",
      "rule": "fuzzy",
      "samples": [
        "wakker worden",
        "word wakker",
        "ontwaak"
      ],
      "lang": "nl",
      "wakeup": true
    }
  },
  "stt": {
    "module": "ovos-stt-plugin-server",
    "fallback_module": "",
    "ovos-stt-plugin-citrinet": {
        "lang": "nl"
    }
  },
  "tts": {
     "module": "ovos-tts-plugin-piper",
     "ovos-tts-plugin-piper": {
        "voice": "mls_5809-low"
     }
  }

}